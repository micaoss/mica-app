name: mica_app
description: "Set up and manage mica devices: micad's BLE provisioning protocol 1, and the device's HTTP API."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  universal_ble: ^3.1.2
  intl: any
  pointycastle: ^4.0.0
  url_launcher: ^6.3.3
  qr_flutter: ^4.1.0
  multicast_dns: ^0.3.3+1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
