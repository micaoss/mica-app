name: mica_app
description: "Set up and manage mica devices: micad's BLE provisioning protocol 1, and the device's HTTP API."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  universal_ble: ^3.1.2
  intl: any
  pointycastle: ^4.0.0
  url_launcher: ^6.3.3
  qr_flutter: ^4.1.0
  multicast_dns: ^0.3.3+1
  shared_preferences: ^2.5.6
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

# `dart run flutter_launcher_icons` regenerates the launcher icons from
# assets/icon, which are the website's Mica icon (mica:website/public/favicon.svg).
flutter_launcher_icons:
  android: true
  image_path_android: assets/icon/icon-android.png
  adaptive_icon_background: "#232E38"
  adaptive_icon_foreground: assets/icon/foreground.png
  ios: true
  image_path_ios: assets/icon/icon.png
  remove_alpha_ios: true
